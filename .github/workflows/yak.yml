name: Rhino 9 Yak package

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/yak.yml'
      - 'build/**'
      - 'SuperHelper/**'
      - 'SuperHelper.GH2/**'
      - 'SuperHelper.GH2.Loader/**'
      - 'SuperHelper.sln'
      - 'YAK/manifest-rh9.yml'
      - 'LICENSE'
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: yak-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  package:
    if: >-
      github.event_name != 'pull_request' || github.event.action != 'closed' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      release_tag: ${{ steps.package.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        id: dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Select .NET 10 SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          if (-not (Test-Path -LiteralPath global.json)) {
            @{ sdk = @{ version = $env:DOTNET_SDK_VERSION; rollForward = 'latestPatch' } } |
              ConvertTo-Json -Depth 3 | Set-Content -LiteralPath global.json -Encoding utf8
          }
      - name: Download standalone Yak
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'yak-cli'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -Uri 'https://files.mcneel.com/yak/tools/0.19.1/win-x64/yak.exe' -OutFile (Join-Path $dir 'yak.exe')
      - name: Restore, build and validate package
        id: package
        run: |
          $parameters = @{
            RepositoryRoot = $env:GITHUB_WORKSPACE
            YakExecutable = Join-Path $env:RUNNER_TEMP 'yak-cli/yak.exe'
            OutputRoot = Join-Path $env:RUNNER_TEMP 'superhelper-yak'
          }
          ./build/Build-Yak.ps1 @parameters
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: superhelper-rhino9-yak
          path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.metadata_path }}
          if-no-files-found: error
  mac-build:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        id: dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Select .NET 10 SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          if (-not (Test-Path -LiteralPath global.json)) {
            @{ sdk = @{ version = $env:DOTNET_SDK_VERSION; rollForward = 'latestPatch' } } |
              ConvertTo-Json -Depth 3 | Set-Content -LiteralPath global.json -Encoding utf8
          }
      - name: Verify macOS Release build
        run: |
          dotnet restore SuperHelper.sln --source 'https://api.nuget.org/v3/index.json'
          if ($LASTEXITCODE -ne 0) { throw 'macOS NuGet restore failed.' }
          dotnet build SuperHelper.sln -c Release --no-restore -v minimal
          if ($LASTEXITCODE -ne 0) { throw 'macOS Release build failed.' }
  publish:
    if: >-
      github.repository == 'ArchiBC/SuperHelper' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [package, mac-build]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check publish credential is configured
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YAK_TOKEN)) { throw 'Configure repository secret YAK_TOKEN.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/yak-artifact
          digest-mismatch: error
      - name: Download standalone Yak
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'yak-cli'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -Uri 'https://files.mcneel.com/yak/tools/0.19.1/win-x64/yak.exe' -OutFile (Join-Path $dir 'yak.exe')
      - name: Create release and publish the validated file
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          $parameters = @{
            PackageDirectory = Join-Path $env:RUNNER_TEMP 'yak-artifact'
            ReleaseTag = $env:RELEASE_TAG
            Repository = $env:GITHUB_REPOSITORY
            YakExecutable = Join-Path $env:RUNNER_TEMP 'yak-cli/yak.exe'
            TargetCommit = $env:RELEASE_COMMIT
            CreateRelease = $true
            Publish = $true
          }
          ./build/Publish-Yak.ps1 @parameters
